name: CI

# Runs the full check suite (type check, unit tests, and the 360px Playwright
# mobile smoke test) on every pull request. deploy.yml intentionally skips the
# Playwright run to keep pushes to main fast (see docs/PROJECT_STATUS.md); this
# workflow is where that suite actually runs before a PR merges.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Version comes from package.json's "packageManager" field.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: PDF freshness check
        run: pnpm check:pdfs

      - name: Spelling check (content/*.md)
        run: pnpm check:spelling

      - name: Title-tally integrity check (content/*.md)
        run: pnpm check:award-tallies

      - name: "\"The only X to Y\" superlative-claim verification-ledger check (content/*.md)"
        run: pnpm check:superlative-claims

      - name: "\"The first/second/.../tenth X to Y\" ordinal-claim verification-ledger check (content/*.md)"
        run: pnpm check:ordinal-claims

      - name: "Record-claim (most/record/youngest/oldest/etc.) verification-ledger check (content/*.md)"
        run: pnpm check:record-claims

      - name: "\"Consecutive\"/\"back-to-back\" claim verification-ledger check (content/*.md)"
        run: pnpm check:consecutive-claims

      - name: "\"Since <year>\" completeness-claim verification-ledger check (content/*.md)"
        run: pnpm check:since-claims

      - name: Edition-page header-label translation check
        run: pnpm check:edition-header-labels

      - name: Build
        run: pnpm build

      - name: Spelling check (Croatian note-card prose, built /hr/* pages)
        run: pnpm check:spelling-hr

      - name: Page-weight budget check
        run: pnpm check:perf

      - name: Internal link integrity check
        run: pnpm check:links

      - name: Sitemap integrity check
        run: pnpm check:sitemap

      - name: JSON-LD structural-validity check
        run: pnpm check:jsonld

      - name: Heading-outline check
        run: pnpm check:heading-outline

      - name: Theme pre-paint ordering check
        run: pnpm check:theme-flash

      - name: PDF outline/bookmark integrity check
        run: pnpm check:pdf-outline

      - name: Page-reachability check
        run: pnpm check:reachability

      - name: Title/meta-description integrity check
        run: pnpm check:meta

      - name: English/Croatian note-section parity check
        run: pnpm check:i18n-notes

      - name: English/Croatian attendance-number format check
        run: pnpm check:attendance-format

      - name: Verification-ledger claim/Croatian-translation anchor check
        run: pnpm check:claims-hr

      - name: Ambiguous link-name check
        run: pnpm check:link-names

      - name: Offline install (manifest/service worker) integrity check
        run: pnpm check:precache

      - name: Image-dimension integrity check (manifest icons, og:image/twitter:image)
        run: pnpm check:image-dimensions

      - name: Locale-consistency check (<html lang> vs URL)
        run: pnpm check:locale-consistency

      - name: Theme-color meta/CSS-token consistency check
        run: pnpm check:theme-color

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Mobile smoke test (360px; builds and previews the site itself)
        run: pnpm test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
