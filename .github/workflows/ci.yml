name: CI

# Runs the full check suite (type check, unit tests, and the 360px Playwright
# mobile smoke test) on every pull request. deploy.yml intentionally skips the
# Playwright run to keep pushes to main fast (see docs/PROJECT_STATUS.md); this
# workflow is where that suite actually runs before a PR merges.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from package.json's "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: PDF freshness check
        run: pnpm check:pdfs

      - name: Build
        run: pnpm build

      - name: Page-weight budget check
        run: pnpm check:perf

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Mobile smoke test (360px; builds and previews the site itself)
        run: pnpm test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
